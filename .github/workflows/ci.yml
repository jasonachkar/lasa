name: Linux verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    if: vars.PUBLISHING_PROVIDER != 'local'
    env:
      VERSION: '0.0.0'
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: make tools
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make check fuzz reproducible release-binaries sbom
      - name: Package and signed repository integration
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg gpgv shellcheck createrepo-c rpm pacman-package-manager makepkg libarchive-tools gettext-base zstd
          make packages
          bash test/distribution.sh
          bash test/versioning.sh
          bash test/domain.sh
          bash test/bootstrap-distribution.sh
          python3 -m unittest discover -s test -p 'test_*.py'
          shellcheck scripts/*.sh test/*.sh
      - name: Real container view smoke test
        run: |
          version=$(make -s print-version)
          if [ "$(uname -m)" = aarch64 ]; then binary="dist/lasa-$version-linux-arm64"; else binary="dist/lasa-$version-linux-amd64"; fi
          docker build --build-arg LASA_BINARY="$binary" -t lasa-ci -f deploy/container/Dockerfile .
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges lasa-ci doctor --format json
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges lasa-ci scan --profile container --format json > container-report.json
          ./bin/lasa report --input container-report.json --format html --output container-report.html
  bpf-build:
    if: vars.PUBLISHING_PROVIDER != 'local'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
      - run: docker build -t lasa-bpf -f bpf/Dockerfile .
      - name: Regenerate and compare sensor objects
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GOPATH=/tmp/go -v "$PWD:/src" -v "$(go env GOROOT):/opt/go:ro" lasa-bpf
          git diff --exit-code -- internal/collector/ebpf/sensor_bpfel.go internal/collector/ebpf/sensor_bpfel.o
  macos-publishing-bootstrap:
    if: vars.PUBLISHING_PROVIDER != 'local'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install key-generation tools
        run: brew install gnupg jq
      - name: Exercise setup with the macOS system Bash
        run: |
          /bin/bash test/bootstrap-distribution.sh
          /bin/bash test/domain.sh
          /bin/bash test/versioning.sh
