name: Authorized privileged Linux VM tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensor:
    # Dedicated disposable VMs only; never run untrusted pull-request code here.
    runs-on: [self-hosted, linux, lasa-privileged]
    timeout-minutes: 15
    environment: privileged-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.2'
      - run: LASA_PRIVILEGED_TESTS=1 go test -count=1 -v ./test/integration -run Privileged
      - run: make build && ./bin/lasa scan --profile deep --format json --output /tmp/lasa-vm.report.json
