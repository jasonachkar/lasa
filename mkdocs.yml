site_name: LASA Documentation
site_description: Use LASA to understand local Linux attack surface, collection scope, evidence, privacy and operational limits.
site_url: https://lasa.secureobs.com/
docs_dir: .build/public-docs
site_dir: .build/docs-site
strict: true
theme:
  name: material
  custom_dir: docs/theme
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - toc:
      title: On this page
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  generator: false
extra_css:
  - assets/site.css
extra_javascript:
  - assets/site.js
nav:
  - Start here:
      - Welcome: index.md
      - Product guide: product-guide.md
      - Install LASA: installation.md
  - Use LASA:
      - Security inspections: security-inspections.md
      - Package advisories: package-advisories.md
      - CLI reference: cli-reference.md
      - Understand results: results.md
      - Operate and deploy: operations.md
      - Troubleshoot: troubleshooting.md
  - Trust and scope:
      - Collection, access and privacy: data-and-privacy.md
      - Detection coverage: detection-coverage.md
      - Compatibility and limits: compatibility.md
      - SecureObs and local exports: secureobs.md
validation:
  links:
    not_found: warn
    unrecognized_links: warn
