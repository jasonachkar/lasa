{
  "schema": "lasa.rules/v1",
  "rules": [
    {
      "id": "LASA-001",
      "version": "1",
      "subject": "process",
      "category": "exposure",
      "title": "Privileged listener with dangerous initial-user-namespace capabilities",
      "description": "A non-loopback listener is owned by a process with a dangerous effective capability in the initial user namespace. Reachability beyond this namespace is unverified.",
      "severity": "high",
      "confidence": "high",
      "unknown": "skip",
      "required_evidence": [
        "network.potential",
        "capability.dangerous"
      ],
      "prerequisites": [
        "Network access to the listener and a flaw or misconfiguration in the service that lets a client control the process."
      ],
      "remediation": "Remove unnecessary capabilities, run under a dedicated account and restrict listener reachability.",
      "when": {
        "all": [
          {
            "predicate": "network.potential",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "capability.dangerous",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "A client that compromises this service would act with the dangerous capabilities the process holds, beyond what an ordinary service account can do.",
      "impact": "Compromise of a network-facing service would directly grant powerful host-level capabilities."
    },
    {
      "id": "LASA-002",
      "version": "1",
      "subject": "process",
      "category": "exposure",
      "title": "Confirmed exposure with initial-namespace root privilege",
      "description": "A separately confirmed exposure fact combines with initial-user-namespace root privilege. Static collection never asserts confirmed exposure.",
      "severity": "critical",
      "confidence": "high",
      "unknown": "skip",
      "required_evidence": [
        "network.confirmed",
        "privilege.host_root"
      ],
      "prerequisites": [
        "An independently confirmed reachable entry point and a flaw in the service."
      ],
      "remediation": "Restrict the independently verified entry point and remove root execution.",
      "when": {
        "all": [
          {
            "predicate": "network.confirmed",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "privilege.host_root",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "A reachable entry point that is compromised would give the attacker root in the initial user namespace.",
      "impact": "Full host control through a confirmed reachable root service."
    },
    {
      "id": "LASA-003",
      "version": "1",
      "subject": "process",
      "category": "exposure",
      "title": "Potentially exposed conventional management port",
      "description": "A process owns a non-loopback endpoint on a conventional management or database port. Port number does not establish protocol identity or internet reachability.",
      "severity": "medium",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "network.potential",
        "network.management"
      ],
      "prerequisites": [
        "Network access to the port beyond loopback (host firewall, cloud security groups and NAT are not evaluated)."
      ],
      "remediation": "Verify the service and its intended clients; bind to a restricted interface and enforce authentication and network policy.",
      "when": {
        "all": [
          {
            "predicate": "network.potential",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "network.management",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "Remote clients that can reach this port can attempt authentication or protocol attacks against a database or management service.",
      "impact": "Exposure of a database or management interface to networks beyond this host."
    },
    {
      "id": "LASA-004",
      "version": "1",
      "subject": "process",
      "category": "isolation",
      "title": "Initial-namespace root process without seccomp or NoNewPrivs",
      "description": "A root process in the initial user namespace reports seccomp disabled and NoNewPrivs disabled. This is a conditional hardening risk, not evidence of compromise.",
      "severity": "medium",
      "confidence": "high",
      "unknown": "skip",
      "required_evidence": [
        "privilege.host_root",
        "isolation.weak"
      ],
      "prerequisites": [
        "A flaw that gives an attacker code execution inside this root process."
      ],
      "remediation": "Validate workload compatibility, reduce privilege, and configure service-level NoNewPrivileges and appropriate syscall filtering.",
      "when": {
        "all": [
          {
            "predicate": "privilege.host_root",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "isolation.weak",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "Code execution in this process would run as root without a syscall filter or the no-new-privileges restriction to limit it.",
      "impact": "A compromise of this process is not contained by seccomp or NoNewPrivs."
    },
    {
      "id": "LASA-005",
      "version": "1",
      "subject": "process",
      "category": "container",
      "title": "Container hint with initial PID namespace access",
      "description": "Cgroup naming suggests a container while the process belongs to the initial PID namespace. Container identification remains heuristic.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "container.hint",
        "container.host_pid"
      ],
      "prerequisites": [
        "Code execution inside the workload."
      ],
      "remediation": "Verify the runtime boundary and avoid sharing the host PID namespace where unnecessary.",
      "when": {
        "all": [
          {
            "predicate": "container.hint",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "container.host_pid",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "A workload that appears containerized but shares the host PID namespace can see, and may be able to signal or trace, host processes.",
      "impact": "A weakened container boundary for this workload."
    },
    {
      "id": "LASA-006",
      "version": "1",
      "subject": "file",
      "category": "container",
      "title": "Runtime control socket has permissive write metadata",
      "description": "A scoped container runtime socket path has write permission bits for others or a non-root group. Effective access and runtime authorization remain conditional.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "file.kind",
        "file.write_candidate"
      ],
      "prerequisites": [
        "Write access through the reported permission: any account it grants (other users, or members of the file's group) and any process running as one."
      ],
      "remediation": "Restrict socket ownership and group membership; verify ACLs, mount state and runtime authorization. Do not expose the socket to workloads.",
      "when": {
        "all": [
          {
            "predicate": "file.kind",
            "op": "eq",
            "value": "runtime_socket"
          },
          {
            "predicate": "file.write_candidate",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "An account that can write to a container runtime socket can usually start a privileged container and gain root on the host.",
      "impact": "Effective root on the host through the container runtime API."
    },
    {
      "id": "LASA-007",
      "version": "1",
      "subject": "file",
      "category": "execution",
      "title": "Privileged executable inode has unsafe write metadata",
      "description": "A scoped file inode matches an executable inode reported by an initial-user-namespace root process and has permissive write metadata. Effective access and future execution remain conditional.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "file.privileged_execution",
        "file.write_candidate"
      ],
      "prerequisites": [
        "Write access through the reported permission: any account it grants (other users, or members of the file's group) and any process running as one."
      ],
      "remediation": "Restrict executable write permissions and confirm the running executable inode before replacing or restarting the service.",
      "when": {
        "all": [
          {
            "predicate": "file.privileged_execution",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "file.write_candidate",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "Replacing this executable changes what a running root process executes the next time it is started.",
      "impact": "Code execution as root on the next start of the affected program."
    },
    {
      "id": "LASA-008",
      "version": "1",
      "subject": "file",
      "category": "execution",
      "title": "Service launch configuration has unsafe write metadata",
      "description": "A scoped systemd service or drop-in configuration path has permissive write metadata. Unit activation and daemon reload behavior are prerequisites.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "file.kind",
        "file.write_candidate"
      ],
      "prerequisites": [
        "Write access through the reported permission: any account it grants (other users, or members of the file's group) and any process running as one.",
        "The unit is loaded, and the manager reloads or the service restarts."
      ],
      "remediation": "Restrict unit and drop-in ownership and permissions. Review enabled units and reload configuration only through change control.",
      "when": {
        "all": [
          {
            "predicate": "file.kind",
            "op": "eq",
            "value": "service_config"
          },
          {
            "predicate": "file.write_candidate",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "An account that can edit this unit or drop-in can change the command systemd runs, typically as root, on the next reload or restart.",
      "impact": "Code execution as the service user, usually root, after a reload or restart."
    },
    {
      "id": "LASA-009",
      "version": "1",
      "subject": "file",
      "category": "identity",
      "title": "Sudoers configuration has unsafe write metadata",
      "description": "A sudoers configuration path has permissive write metadata. Sudo may reject insecure modes; LASA does not claim the file will be accepted.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "file.kind",
        "file.write_candidate"
      ],
      "prerequisites": [
        "Write access through the reported permission: any account it grants (other users, or members of the file's group) and any process running as one.",
        "sudo accepts the file (by default sudo refuses files that are world-writable)."
      ],
      "remediation": "Use root ownership and restrictive sudoers modes; validate configuration through the system sudoers administration workflow.",
      "when": {
        "all": [
          {
            "predicate": "file.kind",
            "op": "eq",
            "value": "sudoers"
          },
          {
            "predicate": "file.write_candidate",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "An account that can edit sudoers configuration can grant itself unrestricted sudo rights if sudo accepts the file.",
      "impact": "Root access for any account the write permission covers."
    },
    {
      "id": "LASA-010",
      "version": "1",
      "subject": "file",
      "category": "execution",
      "title": "SUID executable has an unsafe write path candidate",
      "description": "A SUID file has unsafe write permission bits or an inspected writable ancestor. Actual replacement and SUID execution depend on ownership, sticky bits, ACLs, mounts and execution policy.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "file.suid",
        "file.executable"
      ],
      "prerequisites": [
        "Write access through the reported permission: any account it grants (other users, or members of the file's group) and any process running as one."
      ],
      "remediation": "Remove unnecessary SUID and restrict file and ancestor permissions; verify sticky directories, nosuid/noexec, ACLs and inode identity.",
      "when": {
        "all": [
          {
            "predicate": "file.executable",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "file.suid",
            "op": "eq",
            "value": true
          },
          {
            "any": [
              {
                "predicate": "file.write_candidate",
                "op": "eq",
                "value": true
              },
              {
                "predicate": "file.unsafe_parent",
                "op": "eq",
                "value": true
              }
            ]
          }
        ]
      },
      "scenario": "Replacing a SUID executable, or a directory on its path, lets the next caller run attacker code with the file owner's privileges.",
      "impact": "Privilege escalation to the owner of the SUID file, typically root."
    },
    {
      "id": "LASA-011",
      "version": "1",
      "subject": "file",
      "category": "execution",
      "title": "File-capability executable has an unsafe write path candidate",
      "description": "An executable with a security.capability xattr has permissive file or ancestor write metadata. Capability persistence and execution effect require separate verification.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "file.capability",
        "file.executable"
      ],
      "prerequisites": [
        "Write access through the reported permission: any account it grants (other users, or members of the file's group) and any process running as one."
      ],
      "remediation": "Restrict executable and directory permissions; remove unnecessary file capabilities and verify that the xattr has intended semantics.",
      "when": {
        "all": [
          {
            "predicate": "file.executable",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "file.capability",
            "op": "eq",
            "value": true
          },
          {
            "any": [
              {
                "predicate": "file.write_candidate",
                "op": "eq",
                "value": true
              },
              {
                "predicate": "file.unsafe_parent",
                "op": "eq",
                "value": true
              }
            ]
          }
        ]
      },
      "scenario": "Replacing this file, or a directory on its path, would run attacker code with the capabilities granted to the file.",
      "impact": "Privilege escalation to the file's capability set."
    },
    {
      "id": "LASA-012",
      "version": "1",
      "subject": "file",
      "category": "execution",
      "title": "Conventional privileged command search directory is writable",
      "description": "A conventional system executable search directory has permissive write metadata. Actual use in a privileged PATH is unknown because environments are not collected.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "file.kind",
        "file.search_path",
        "file.write_candidate"
      ],
      "prerequisites": [
        "Write access through the reported permission: any account it grants (other users, or members of the file's group) and any process running as one.",
        "A privileged process resolves commands through this directory in its PATH."
      ],
      "remediation": "Restrict directory ownership and write permissions; verify privileged service command resolution and use absolute executable paths.",
      "when": {
        "all": [
          {
            "predicate": "file.kind",
            "op": "eq",
            "value": "directory"
          },
          {
            "predicate": "file.search_path",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "file.write_candidate",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "An account that can add files here can shadow commands that privileged scripts and users run by name.",
      "impact": "Code execution in the context of privileged users or services that use this directory."
    },
    {
      "id": "LASA-013",
      "version": "1",
      "subject": "file",
      "category": "identity",
      "title": "Authorized-key path has unsafe write metadata",
      "description": "An explicitly scoped authorized_keys path has permissive write metadata. SSH may reject it under StrictModes; effective access and SSH configuration are unverified.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "file.kind",
        "file.write_candidate"
      ],
      "prerequisites": [
        "Write access through the reported permission: any account it grants (other users, or members of the file's group) and any process running as one.",
        "sshd accepts the file (StrictModes rejects group- or world-writable key files by default)."
      ],
      "remediation": "Restrict the key file and parent directory ownership and permissions; verify SSH StrictModes and the effective authorized-key path.",
      "when": {
        "all": [
          {
            "predicate": "file.kind",
            "op": "eq",
            "value": "authorized_keys"
          },
          {
            "predicate": "file.write_candidate",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "An account that can edit this file can add its own SSH key and log in as the account that owns it.",
      "impact": "Login as the owning account without its password."
    },
    {
      "id": "LASA-014",
      "version": "1",
      "subject": "process",
      "category": "container",
      "title": "Container hint with sensitive host-style mount path",
      "description": "A process with a container cgroup hint sees a mount at a sensitive /host/etc, /host/proc or /host/sys style path. Source ownership and effective access are not established.",
      "severity": "high",
      "confidence": "medium",
      "unknown": "skip",
      "required_evidence": [
        "container.hint",
        "container.sensitive_mount"
      ],
      "prerequisites": [
        "Code execution inside the workload."
      ],
      "remediation": "Verify the mount source and namespace, remove unnecessary host-style mounts and prefer read-only narrowly scoped mounts.",
      "when": {
        "all": [
          {
            "predicate": "container.hint",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "container.sensitive_mount",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "A workload with host configuration, proc or sys trees mounted can read or change host state through them.",
      "impact": "Host information disclosure or modification from the workload."
    },
    {
      "id": "LASA-015",
      "version": "1",
      "subject": "process",
      "category": "isolation",
      "title": "Dangerous root capabilities combined with weak isolation",
      "description": "An initial-user-namespace root process has dangerous effective capabilities, disabled seccomp and disabled NoNewPrivs. Compromise is conditional.",
      "severity": "high",
      "confidence": "high",
      "unknown": "skip",
      "required_evidence": [
        "privilege.host_root",
        "capability.dangerous",
        "isolation.weak"
      ],
      "prerequisites": [
        "A flaw that gives an attacker code execution inside this root process."
      ],
      "remediation": "Remove unnecessary capabilities and root execution, then apply tested NoNewPrivileges and syscall restrictions.",
      "when": {
        "all": [
          {
            "predicate": "privilege.host_root",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "capability.dangerous",
            "op": "eq",
            "value": true
          },
          {
            "predicate": "isolation.weak",
            "op": "eq",
            "value": true
          }
        ]
      },
      "scenario": "Code execution in this process would hold dangerous capabilities with no syscall filter or no-new-privileges restriction.",
      "impact": "Host compromise from a single process compromise."
    }
  ]
}
