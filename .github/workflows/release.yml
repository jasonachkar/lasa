name: Build and attest release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag pointing at the selected main commit
        required: true
        type: string
permissions: {}
concurrency:
  group: lasa-release
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source before executing build code
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/security/verify-release-source.sh "$RELEASE_TAG"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and verify assets
        run: |
          go_bin=$(go env GOPATH)/bin
          export VERSION=${RELEASE_TAG#v} PATH="$go_bin:$PATH"
          make tools
          make check reproducible packages
          test "$VERSION" = "$(./bin/lasa version)"
          mkdir release-assets
          tar --sort=name --mtime="@$(git show -s --format=%ct HEAD)" --owner=0 --group=0 --numeric-owner -C dist -cf - licenses | gzip -n > "release-assets/lasa-$VERSION-licenses.tar.gz"
          cp dist/lasa-*-linux-amd64 dist/lasa-*-linux-arm64 dist/*.deb dist/*.cdx.json dist/*.tar.gz release-assets/
          python3 scripts/security/verify-release-assets.py --write release-assets "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload
        with:
          name: release-assets-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: release-assets
          digest-mismatch: error
      - run: python3 scripts/security/verify-release-assets.py release-assets "${RELEASE_TAG#v}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/SHA256SUMS
