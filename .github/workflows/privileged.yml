name: Authorized privileged Linux VM tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensor:
    # Dedicated disposable VMs only; never run untrusted pull-request code here.
    strategy:
      fail-fast: false
      matrix:
        architecture: [X64, ARM64]
    runs-on: [self-hosted, linux, lasa-privileged, "${{ matrix.architecture }}"]
    timeout-minutes: 45
    environment: privileged-tests
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Native kernel, inspection and operational validation
        run: sudo --preserve-env=LASA_VALIDATION_REVISION bash scripts/validate-linux-vm.sh --disposable-vm
        env:
          LASA_VALIDATION_REVISION: ${{ github.sha }}
