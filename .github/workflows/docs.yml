name: Customer documentation
on:
  push:
    branches: [main]
    paths: ['docs/customer/**', 'docs/website/**', 'docs/theme/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/prepare-docs.py', 'scripts/publish-docs.sh', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/customer/**', 'docs/website/**', 'docs/theme/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/prepare-docs.py', 'scripts/publish-docs.sh', '.github/workflows/docs.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: lasa-distribution
  cancel-in-progress: false
jobs:
  docs:
    if: vars.PUBLISHING_PROVIDER != 'local'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: bash test/docs.sh
  publish:
    needs: docs
    if: vars.PUBLISHING_PROVIDER != 'azure' && vars.PUBLISHING_PROVIDER != 'local' && github.event_name != 'pull_request' && vars.DISTRIBUTION_REPOSITORY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: python scripts/prepare-docs.py
      - name: Publish versioned customer documentation
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          DISTRIBUTION_REPOSITORY: ${{ vars.DISTRIBUTION_REPOSITORY }}
          DISTRIBUTION_BRANCH: ${{ vars.DISTRIBUTION_BRANCH }}
          DISTRIBUTION_DEPLOY_KEY: ${{ secrets.DISTRIBUTION_DEPLOY_KEY }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: |
          version=$REQUESTED_VERSION
          if [ -z "$version" ]; then
            # Publish the maintained product documentation independently of packages.
            version=current
          fi
          bash scripts/publish-docs.sh "$version"
