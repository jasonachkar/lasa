name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.2'
      - name: Verify version tag
        run: test "$GITHUB_REF_NAME" = "v$(go run ./cmd/lasa version)"
      - run: make test vet reproducible release-binaries tools
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make sbom
      - name: Bind checksums to binaries and SBOMs
        run: |
          tar -C dist -czf dist/lasa-0.1.0-licenses.tar.gz licenses
          cd dist && sha256sum lasa-*-linux-* *.cdx.json *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/lasa-*-linux-*
            dist/*.cdx.json
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/lasa-*-linux-* dist/*.cdx.json dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes
